<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Organize Your Life</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- Font Awesome for Icons (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="app-wrapper">
        <header class="app-header">
            <h1 class="logo"><i class="fa-solid fa-layer-group"></i> TaskFlow</h1>
            <p class="subtitle">Focus on what matters most.</p>
        </header>

        <main class="todo-container">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off">
                <button id="addTaskBtn" aria-label="Add Task">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul class="task-list" id="taskList">
                <!-- Tasks will be injected here via JS -->
            </ul>

            <div class="empty-state" id="emptyState">
                <i class="fa-regular fa-clipboard"></i>
                <p>No tasks found. Enjoy your day!</p>
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2026 TaskFlow. All rights reserved.</p>
        </footer>
    </div>

    <script src="assets/js/main.js"></script>
</body>

</html>
