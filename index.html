<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="TaskFlow - A beautiful, modern To-Do List application for organizing your tasks with style">
    <meta name="keywords" content="todo, task manager, productivity, task list, todo app">
    <meta name="author" content="TaskFlow">
    <title>TaskFlow - Modern To-Do List</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./assets/css/main.css">
</head>

<body>
    <!-- Main Container -->
    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="title-icon">✨</span>
                    TaskFlow
                </h1>
                <p class="app-subtitle">Organize your life, one task at a time</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Task Input Section -->
            <section class="task-input-section">
                <div class="input-container">
                    <input type="text" id="taskInput" class="task-input" placeholder="What needs to be done today?"
                        aria-label="New task input">
                    <button id="addTaskBtn" class="add-btn" aria-label="Add task">
                        <span class="btn-icon">+</span>
                    </button>
                </div>

                <!-- Task Options -->
                <div class="task-options">
                    <select id="prioritySelect" class="priority-select" aria-label="Task priority">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>

                    <input type="text" id="categoryInput" class="category-input" placeholder="Category (optional)"
                        aria-label="Task category">

                    <input type="date" id="dueDateInput" class="date-input" aria-label="Due date">
                </div>
            </section>

            <!-- Controls Section -->
            <section class="controls-section">
                <!-- Filter Buttons -->
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all" id="filterAll">All</button>
                    <button class="filter-btn" data-filter="active" id="filterActive">Active</button>
                    <button class="filter-btn" data-filter="completed" id="filterCompleted">Completed</button>
                </div>

                <!-- Search Bar -->
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search tasks..."
                        aria-label="Search tasks">
                </div>
            </section>

            <!-- Statistics Section -->
            <section class="stats-section">
                <div class="stat-card">
                    <span class="stat-number" id="totalTasks">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="activeTasks">0</span>
                    <span class="stat-label">Active</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="completedTasks">0</span>
                    <span class="stat-label">Completed</span>
                </div>
            </section>

            <!-- Tasks List -->
            <section class="tasks-section">
                <ul id="taskList" class="task-list" role="list">
                    <!-- Tasks will be dynamically added here -->
                </ul>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📝</div>
                    <h3 class="empty-title">No tasks yet</h3>
                    <p class="empty-text">Add your first task to get started!</p>
                </div>
            </section>

            <!-- Clear Completed Button -->
            <div class="action-buttons">
                <button id="clearCompletedBtn" class="clear-btn">
                    Clear Completed
                </button>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with <span class="heart">💜</span> by TaskFlow Team</p>
        </footer>

    </div>

    <!-- JavaScript -->
    <script src="./assets/js/main.js"></script>
</body>

</html>
