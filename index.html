<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Modern To-Do List App</title>
    <meta name="description"
        content="TaskFlow is a beautiful, modern to-do list application to help you stay organized and productive.">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="container py-4 py-md-5">
        <!-- Header -->
        <header class="text-center mb-5">
            <div class="logo-container mb-3">
                <i class="bi bi-check2-circle logo-icon"></i>
            </div>
            <h1 class="app-title">TaskFlow</h1>
            <p class="app-subtitle">Organize your life, one task at a time</p>
        </header>

        <!-- Main Content -->
        <main class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-7">
                <!-- Add Task Card -->
                <div class="glass-card add-task-card mb-4">
                    <form id="taskForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text">
                                        <i class="bi bi-plus-lg"></i>
                                    </span>
                                    <input type="text" class="form-control" id="taskInput"
                                        placeholder="What needs to be done?" required>
                                </div>
                            </div>
                            <div class="col-12 col-sm-4">
                                <select class="form-select" id="prioritySelect">
                                    <option value="low">🟢 Low Priority</option>
                                    <option value="medium" selected>🟡 Medium Priority</option>
                                    <option value="high">🔴 High Priority</option>
                                </select>
                            </div>
                            <div class="col-12 col-sm-4">
                                <input type="date" class="form-control" id="dueDateInput">
                            </div>
                            <div class="col-12 col-sm-4">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-plus-circle me-2"></i>Add Task
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Filter & Stats Card -->
                <div class="glass-card filter-card mb-4">
                    <div class="row align-items-center g-3">
                        <div class="col-12 col-md-7">
                            <div class="filter-buttons" role="group" aria-label="Task filters">
                                <button type="button" class="filter-btn active" data-filter="all">
                                    <i class="bi bi-list-ul me-1"></i>All
                                </button>
                                <button type="button" class="filter-btn" data-filter="active">
                                    <i class="bi bi-circle me-1"></i>Active
                                </button>
                                <button type="button" class="filter-btn" data-filter="completed">
                                    <i class="bi bi-check-circle me-1"></i>Completed
                                </button>
                            </div>
                        </div>
                        <div class="col-12 col-md-5 text-md-end">
                            <div class="task-stats">
                                <span class="stat-badge">
                                    <i class="bi bi-list-check"></i>
                                    <span id="totalTasks">0</span> total
                                </span>
                                <span class="stat-badge completed-stat">
                                    <i class="bi bi-check2-all"></i>
                                    <span id="completedTasks">0</span> done
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Task List -->
                <div class="glass-card task-list-card">
                    <div id="taskList" class="task-list">
                        <!-- Empty State -->
                        <div id="emptyState" class="empty-state">
                            <i class="bi bi-clipboard2-check empty-icon"></i>
                            <h5>No tasks yet!</h5>
                            <p>Add your first task above to get started</p>
                        </div>
                    </div>

                    <!-- Clear Completed -->
                    <div id="clearCompletedContainer" class="clear-completed-container d-none">
                        <button type="button" class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">
                            <i class="bi bi-trash3 me-1"></i>Clear Completed
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center mt-5">
            <p class="footer-text">
                Made with <i class="bi bi-heart-fill text-danger"></i> by
                <a href="https://github.com/shivankushsingh09" target="_blank" rel="noopener">Shivankush Singh</a>
            </p>
        </footer>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="editModalLabel">
                        <i class="bi bi-pencil-square me-2"></i>Edit Task
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editTaskId">
                        <div class="mb-3">
                            <label for="editTaskInput" class="form-label">Task Description</label>
                            <input type="text" class="form-control" id="editTaskInput" required>
                        </div>
                        <div class="row g-3">
                            <div class="col-6">
                                <label for="editPrioritySelect" class="form-label">Priority</label>
                                <select class="form-select" id="editPrioritySelect">
                                    <option value="low">🟢 Low</option>
                                    <option value="medium">🟡 Medium</option>
                                    <option value="high">🔴 High</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label for="editDueDateInput" class="form-label">Due Date</label>
                                <input type="date" class="form-control" id="editDueDateInput">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEditBtn">
                        <i class="bi bi-check-lg me-1"></i>Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>

</html>
</CodeContent>
<parameter name="EmptyFile">false
