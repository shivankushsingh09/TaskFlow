<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Your Personal Task Manager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary navbar-expand-lg sticky-top">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-tasks"></i> TaskFlow
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10 col-sm-12">
                <!-- Header Section -->
                <div class="text-center mb-5">
                    <h1 class="display-5 fw-bold text-dark mb-2">TaskFlow</h1>
                    <p class="lead text-muted">Your Personal Task Manager</p>
                </div>

                <!-- Add Task Section -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="fas fa-plus-circle text-success"></i> Add New Task
                        </h5>
                        <div class="input-group mb-3">
                            <input 
                                type="text" 
                                class="form-control form-control-lg" 
                                id="taskInput" 
                                placeholder="What needs to be done?"
                                aria-label="Add a new task"
                            >
                            <button 
                                class="btn btn-primary btn-lg" 
                                type="button" 
                                id="addTaskBtn"
                                onclick="addTask()"
                            >
                                <i class="fas fa-plus"></i> Add
                            </button>
                        </div>
                        <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                            Please enter a task before adding!
                        </div>
                    </div>
                </div>

                <!-- Filter Buttons -->
                <div class="mb-4 d-flex gap-2 flex-wrap">
                    <button class="btn btn-outline-primary active" onclick="filterTasks('all')">
                        <i class="fas fa-list"></i> All
                    </button>
                    <button class="btn btn-outline-warning" onclick="filterTasks('pending')">
                        <i class="fas fa-clock"></i> Pending
                    </button>
                    <button class="btn btn-outline-success" onclick="filterTasks('completed')">
                        <i class="fas fa-check"></i> Completed
                    </button>
                </div>

                <!-- Tasks Statistics -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h6 class="card-title text-muted">Total Tasks</h6>
                                <h3 id="totalTasks" class="text-primary">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h6 class="card-title text-muted">Completed</h6>
                                <h3 id="completedTasks" class="text-success">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h6 class="card-title text-muted">Pending</h6>
                                <h3 id="pendingTasks" class="text-warning">0</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tasks List -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="fas fa-check-square text-info"></i> My Tasks
                        </h5>
                        <div id="tasksList" class="task-list">
                            <div class="text-center text-muted py-5">
                                <i class="fas fa-inbox fa-3x mb-3"></i>
                                <p>No tasks yet. Add one to get started!</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Clear Completed Button -->
                <div class="text-center mt-4">
                    <button 
                        class="btn btn-danger btn-sm" 
                        id="clearCompletedBtn"
                        onclick="clearCompleted()"
                        style="display:none;"
                    >
                        <i class="fas fa-trash-alt"></i> Clear Completed Tasks
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light py-4 mt-5 border-top">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="text-muted mb-0">
                        <strong>TaskFlow</strong> - Stay organized and boost your productivity
                    </p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-muted mb-0">
                        Made with <i class="fas fa-heart text-danger"></i> by Your Name
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- Main JavaScript -->
    <script src="assets/js/main.js"></script>
</body>
</html>
