<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Premium To-Do App</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/main.css">
</head>

<body>

    <div class="background-animate"></div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card glass-card shadow-lg p-4">
            <div class="card-body">
                <h2 class="text-center mb-4 app-title"><i class="fas fa-check-double me-2"></i>TaskFlow</h2>

                <div class="input-group mb-4 search-box">
                    <input type="text" id="taskInput" class="form-control" placeholder="What needs to be done?"
                        autocomplete="off">
                    <button class="btn btn-primary btn-add" type="button" id="addTaskBtn">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>

                <ul class="nav nav-pills nav-fill mb-4 filter-nav">
                    <li class="nav-item">
                        <button class="nav-link active" data-filter="all">All</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-filter="active">Active</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-filter="completed">Completed</button>
                    </li>
                </ul>

                <div class="task-container custom-scrollbar">
                    <ul id="taskList" class="list-unstyled">
                        <!-- Tasks will be injected here -->
                    </ul>

                    <div id="emptyState" class="text-center mt-4 d-none">
                        <i class="fas fa-clipboard-list fa-3x mb-3 text-muted opacity-50"></i>
                        <p class="text-muted">No tasks found. Start by adding one!</p>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-between align-items-center footer-actions">
                    <small class="text-secondary"><span id="taskCount">0</span> items left</small>
                    <button id="clearCompletedBtn" class="btn btn-sm btn-outline-danger border-0">Clear
                        Completed</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/main.js"></script>
</body>

</html>
