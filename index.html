<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Modern Task Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Header -->
                <div class="text-center mb-5">
                    <h1 class="display-4 fw-bold text-primary mb-2">TaskFlow</h1>
                    <p class="text-muted">Simplify your productivity, one task at a time.</p>
                </div>

                <!-- Input Section -->
                <div class="card border-0 shadow-sm mb-4 rounded-4">
                    <div class="card-body p-4">
                        <form id="todo-form" class="input-group">
                            <input type="text" id="todo-input"
                                class="form-control form-control-lg border-0 bg-light rounded-start-4 fs-6"
                                placeholder="What needs to be done?" aria-label="Add a new task" required>
                            <button class="btn btn-primary px-4 rounded-end-4" type="submit" id="add-button">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Filter Controls -->
                <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                    <div id="filter-buttons" class="btn-group btn-group-sm rounded-pill bg-white shadow-sm p-1"
                        role="group">
                        <button type="button" class="btn btn-outline-primary border-0 rounded-pill px-3 active"
                            data-filter="all">All</button>
                        <button type="button" class="btn btn-outline-primary border-0 rounded-pill px-3"
                            data-filter="active">Active</button>
                        <button type="button" class="btn btn-outline-primary border-0 rounded-pill px-3"
                            data-filter="completed">Completed</button>
                    </div>
                    <span id="task-count" class="text-muted small fw-medium">0 items left</span>
                </div>

                <!-- Task List Container -->
                <div id="todo-list" class="list-group list-group-flush shadow-sm rounded-4 overflow-hidden">
                    <!-- Tasks will be rendered here -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="text-center py-5 mt-3 d-none">
                    <div class="display-1 text-muted opacity-25 mb-3">
                        <i class="bi bi-check2-circle"></i>
                    </div>
                    <h5 class="text-muted">All caught up!</h5>
                    <p class="text-muted small">Time to relax or add a new task.</p>
                </div>

                <!-- Clear Completed -->
                <div class="text-center mt-4">
                    <button id="clear-completed" class="btn btn-link btn-sm text-decoration-none text-muted">Clear
                        completed</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>

</html>
